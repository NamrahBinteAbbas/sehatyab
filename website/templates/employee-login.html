<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sehatyaab | Employee Login</title>
  
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="login-card">
      <div class="text-center mb-4">
        <h2 class="login-title">Sehatyaab Employee Login</h2>
        <p class="text-muted">Please enter your credentials</p>
      </div>
      
      <form action="/employee_login" method="POST">
        <!-- Employee ID -->
        <div class="mb-3">
          <label for="employeeId" class="form-label fw-semibold">Employee ID</label>
          <input type="text" name="employeeId" id="employeeId" class="form-control" placeholder="Enter your employee ID" required />
        </div>

        <!-- Password -->
        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">Password</label>
          <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required />
        </div>

        <!-- Login Button -->
        <button type="submit" class="btn btn-primary w-100 py-2 login-btn">Login</button>
      </form>

      <div class="text-center mt-4">
        <p class="mb-0">Patient Login?
          <a href="/login" class="text-decoration-none fw-semibold signup-link">Click Here</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>
</body>
</html>
