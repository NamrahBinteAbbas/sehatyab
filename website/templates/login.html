<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital Login</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="bg-white shadow-lg rounded-2xl p-8 w-96">
    <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">Hospital Login</h2>
    
    <form action="/login" method="POST">
      <!-- User Role -->
      <label class="block text-sm font-semibold mb-1">Login As</label>
      <select name="role" class="w-full border rounded-lg p-2 mb-4">
        <option value="" disabled selected>Select Role</option>
        <option value="patient">Patient</option>
        <option value="doctor">Doctor</option>
        <option value="admin">Admin</option>
      </select>

      <!-- Email -->
      <label class="block text-sm font-semibold mb-1">Email</label>
      <input type="email" name="email" class="w-full border rounded-lg p-2 mb-4" placeholder="Enter your email" required />

      <!-- Password -->
      <label class="block text-sm font-semibold mb-1">Password</label>
      <input type="password" name="password" class="w-full border rounded-lg p-2 mb-4" placeholder="Enter your password" required />

      <!-- Login Button -->
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">Login</button>
    </form>

    <p class="text-center text-sm mt-4">Don't have an account?
      <a href="signup.html" class="text-blue-600 hover:underline">Sign Up</a>
    </p>
  </div>
</body>
</html>
