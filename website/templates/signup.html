<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="bg-white shadow-lg rounded-2xl p-8 w-96">
    <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">Patient Sign Up</h2>

    <form action="/signup" method="POST">
      <!-- Role (fixed to patient) -->
      <label class="block text-sm font-semibold mb-1">Register As</label>
      <input type="text" name="role" value="Patient" readonly class="w-full border rounded-lg p-2 mb-4 bg-gray-100 cursor-not-allowed text-gray-600" />

      <!-- Name -->
      <label class="block text-sm font-semibold mb-1">Full Name</label>
      <input type="text" name="name" class="w-full border rounded-lg p-2 mb-4" placeholder="Enter your name" required />

      <!-- Email -->
      <label class="block text-sm font-semibold mb-1">Email</label>
      <input type="email" name="email" class="w-full border rounded-lg p-2 mb-4" placeholder="Enter your email" required />

      <!-- Password -->
      <label class="block text-sm font-semibold mb-1">Password</label>
      <input type="password" name="password" class="w-full border rounded-lg p-2 mb-4" placeholder="Enter your password" required />

      <!-- Confirm Password -->
      <label class="block text-sm font-semibold mb-1">Confirm Password</label>
      <input type="password" name="confirmPassword" class="w-full border rounded-lg p-2 mb-6" placeholder="Re-enter your password" required />

      <!-- Sign Up Button -->
      <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg transition">Sign Up</button>
    </form>

    <p class="text-center text-sm mt-4">Already have an account?
      <a href="login.html" class="text-blue-600 hover:underline">Login</a>
    </p>

    <p class="text-xs text-gray-500 text-center mt-4">
      * Only patients can register here. Doctors and administrators are registered by hospital staff.
    </p>
  </div>
</body>
</html>
