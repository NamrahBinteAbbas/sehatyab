<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Sign Up</title>
  
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  
  <link rel="stylesheet" href="/static/style.css">
  
  <style>
    .signup-card {
      max-height: 90vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
    <div class="signup-card">
      <div class="text-center mb-4">
        <h2 class="signup-title">Patient Sign Up</h2>
        <p class="text-muted">Create your account to get started</p>
      </div>

      <form action="/signup" method="POST">
        <!-- Role (fixed to patient) -->
        <div class="mb-3">
          <label for="role" class="form-label fw-semibold">Register As</label>
          <input type="text" name="role" id="role" value="Patient" readonly class="form-control role-field" />
        </div>

        <!-- Personal Information Section -->
        <h5 class="mb-3 mt-4 text-primary">Personal Information</h5>

        <!-- Name -->
        <div class="mb-3">
          <label for="name" class="form-label fw-semibold">Full Name</label>
          <input type="text" name="name" id="name" class="form-control" placeholder="Enter your full name" required />
        </div>

        <!-- Age and Gender Row -->
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="age" class="form-label fw-semibold">Age</label>
            <input type="number" name="age" id="age" class="form-control" placeholder="Enter your age" min="1" max="150" required />
          </div>
          <div class="col-md-6">
            <label for="gender" class="form-label fw-semibold">Gender</label>
            <select name="gender" id="gender" class="form-select" required>
              <option value="">Select gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <!-- Address -->
        <div class="mb-3">
          <label for="address" class="form-label fw-semibold">Address</label>
          <textarea name="address" id="address" class="form-control" rows="2" placeholder="Enter your address" required></textarea>
        </div>

        <!-- Contact and Blood Group Row -->
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="contactno" class="form-label fw-semibold">Contact Number</label>
            <input type="tel" name="contactno" id="contactno" class="form-control" placeholder="e.g., 03001234567" required />
          </div>
          <div class="col-md-6">
            <label for="bloodgroup" class="form-label fw-semibold">Blood Group</label>
            <select name="bloodgroup" id="bloodgroup" class="form-select" required>
              <option value="">Select blood group</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>
        </div>

        <!-- Account Information Section -->
        <h5 class="mb-3 mt-4 text-primary">Account Information</h5>

        <!-- Username -->
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold">Username</label>
          <input type="text" name="username" id="username" class="form-control" placeholder="Choose a unique username" required />
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email Address</label>
          <input type="email" name="email" id="email" class="form-control" placeholder="Enter your email" required />
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label fw-semibold">Password</label>
          <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" minlength="6" required />
        </div>

        <!-- Confirm Password -->
        <div class="mb-4">
          <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
          <input type="password" name="confirmPassword" id="confirmPassword" class="form-control" placeholder="Re-enter your password" required />
        </div>

        <!-- Hidden fields for isactive and createdat (handled by backend) -->
        <input type="hidden" name="isactive" value="1" />

        <!-- Sign Up Button -->
        <button type="submit" class="btn btn-success w-100 py-2 signup-btn">Sign Up</button>
      </form>

      <div class="text-center mt-4">
        <p class="mb-0">Already have an account?
          <a href="login.html" class="text-decoration-none fw-semibold login-link">Login</a>
        </p>
      </div>

      <div class="alert alert-info mt-4 info-box" role="alert">
        <small><strong>Note:</strong> Only patients can register here. Doctors and administrators are registered by hospital staff.</small>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>
  
  <!-- Password validation script -->
  <script>
    document.querySelector('form').addEventListener('submit', function(e) {
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (password !== confirmPassword) {
        e.preventDefault();
        alert('Passwords do not match. Please try again.');
        return false;
      }
    });
  </script>
</body>
</html>
