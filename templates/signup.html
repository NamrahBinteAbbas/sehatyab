<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Sign Up</title>
  
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="signup-card">
      <div class="text-center mb-4">
        <h2 class="signup-title">Patient Sign Up</h2>
        <p class="text-muted">Create your account to get started</p>
      </div>

      <form action="/signup" method="POST">
        <!-- Role (fixed to patient) -->
        <div class="mb-3">
          <label for="role" class="form-label fw-semibold">Register As</label>
          <input type="text" name="role" id="role" value="Patient" readonly class="form-control role-field" />
        </div>

        <!-- Name -->
        <div class="mb-3">
          <label for="name" class="form-label fw-semibold">Full Name</label>
          <input type="text" name="name" id="name" class="form-control" placeholder="Enter your name" required />
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email Address</label>
          <input type="email" name="email" id="email" class="form-control" placeholder="Enter your email" required />
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label fw-semibold">Password</label>
          <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required />
        </div>

        <!-- Confirm Password -->
        <div class="mb-4">
          <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
          <input type="password" name="confirmPassword" id="confirmPassword" class="form-control" placeholder="Re-enter your password" required />
        </div>

        <!-- Sign Up Button -->
        <button type="submit" class="btn btn-success w-100 py-2 signup-btn">Sign Up</button>
      </form>

      <div class="text-center mt-4">
        <p class="mb-0">Already have an account?
          <a href="login.html" class="text-decoration-none fw-semibold login-link">Login</a>
        </p>
      </div>

      <div class="alert alert-info mt-4 info-box" role="alert">
        <small><strong>Note:</strong> Only patients can register here. Doctors and administrators are registered by hospital staff.</small>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>
</body>
</html>
