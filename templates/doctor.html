<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sehatyaab - Doctor Panel</title>
  
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  
  <link rel="stylesheet" href="/static/style.css">
  
  <style>
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      margin-top: 20px;
    }
    
    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .calendar-day:hover {
      border-color: #1abc9c;
      transform: scale(1.05);
    }
    
    .calendar-header {
      font-weight: bold;
      color: #2c3e50;
      padding: 10px;
      text-align: center;
    }
    
    .day-empty {
      background: #f8f9fa;
    }
    
    .day-available {
      background: white;
      color: #2c3e50;
    }
    
    .day-booked {
      background: #1abc9c;
      color: white;
    }
    
    .day-partial {
      background: #f39c12;
      color: white;
    }
    
    .day-today {
      border: 3px solid #3498db;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Doctor Panel</h2>
    <ul>
      <li class="active">My Appointments</li>
      <li>Calendar View</li>
      <li>Profile</li>
      <li style="margin-top: 20px; background: #e74c3c;">Logout</li>
    </ul>
  </div>

  <div class="content">
    <h1>My Appointments</h1>
    
    <div class="row mb-4">
      <div class="col-md-3">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <h5 class="text-muted">Today</h5>
            <h2 id="m-today" style="color: #1abc9c;">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <h5 class="text-muted">This Week</h5>
            <h2 id="m-week" style="color: #3498db;">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <h5 class="text-muted">This Month</h5>
            <h2 id="m-month" style="color: #9b59b6;">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <h5 class="text-muted">Total Patients</h5>
            <h2 id="m-patients" style="color: #e67e22;">0</h2>
          </div>
        </div>
      </div>
    </div>
    
    <table>
      <thead>
        <tr>
          <th>Date & Time</th>
          <th>Patient Name</th>
          <th>Contact</th>
          <th>Reason</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="appt-body"></tbody>
    </table>
    
    <div style="margin-top: 50px;">
      <h1>November 2025 Calendar</h1>
      
      <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <button class="btn" style="background: #95a5a6;">&larr; Previous</button>
          <h3 style="margin: 0;">November 2025</h3>
          <button class="btn" style="background: #95a5a6;">Next &rarr;</button>
        </div>
        <!-- keep your toolbar above this -->
<div class="calendar"></div>

        <div style="margin-top: 20px; display: flex; gap: 20px; justify-content: center;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 20px; height: 20px; background: #1abc9c; border-radius: 4px;"></div>
            <span>Fully Booked</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 20px; height: 20px; background: #f39c12; border-radius: 4px;"></div>
            <span>Partially Booked</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 20px; height: 20px; background: white; border: 2px solid #e2e8f0; border-radius: 4px;"></div>
            <span>Available</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>
    <script src="/static/index.js"></script>
</body>
</html>
